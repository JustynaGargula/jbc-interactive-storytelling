# Copy this file to `.streamlit/secrets.toml` and fill in real values.
# Do not commit `.streamlit/secrets.toml`.

[llm]
# Default provider is "gemini" when this section is missing.
# Allowed values: "gemini", "openrouter".
provider = "gemini"

# Gemini settings.
# If gemini_api_key is omitted, google-genai will use the GEMINI_API_KEY environment variable.
gemini_model = "gemini-3-flash-preview"
gemini_api_key = ""

# OpenRouter settings.
# Used only when provider = "openrouter".
openrouter_model = "openai/gpt-4o-mini"
openrouter_api_key = "sk-or-v1-..."

# Keep the existing Google Sheets settings below if the evaluation module is used.
# Example structure only; replace with real service-account data in secrets.toml.

[gcp_service_account]
type = "service_account"
project_id = ""
private_key_id = ""
private_key = ""
client_email = ""
client_id = ""
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = ""

[connections.gsheets]
spreadsheet = ""